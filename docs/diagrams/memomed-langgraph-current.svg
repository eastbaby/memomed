<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="980" viewBox="0 0 1560 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#2f5f73"/>
    </marker>
    <style>
      .bg { fill: #f8fbfb; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #183642; }
      .subtitle { font: 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #5b7080; }
      .node { fill: #ffffff; stroke: #7bb7c8; stroke-width: 2.2; rx: 18; filter: drop-shadow(0 8px 18px rgba(28, 73, 91, 0.10)); }
      .terminal { fill: #e8f5f2; stroke: #57a594; stroke-width: 2.4; }
      .tool { fill: #fff8e8; stroke: #d4a63a; stroke-width: 2.2; }
      .model { fill: #eef4ff; stroke: #658bd8; stroke-width: 2.2; }
      .hitl { fill: #fff0f2; stroke: #d67585; stroke-width: 2.2; }
      .text-main { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #193844; text-anchor: middle; }
      .text-sub { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #526978; text-anchor: middle; }
      .edge { stroke: #2f5f73; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .edge-loop { stroke: #a97716; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .label { font: 14px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #315468; }
      .lane-title { font: 700 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #346577; }
      .lane { fill: #ffffff; stroke: #dbe9ee; stroke-width: 1.5; rx: 20; }
    </style>
  </defs>

  <rect class="bg" width="1560" height="980"/>
  <text class="title" x="780" y="56" text-anchor="middle">Memomed 当前 LangGraph 节点关系图</text>
  <text class="subtitle" x="780" y="88" text-anchor="middle">来源：backend/app/agent/graph.py（当前工作区版本）</text>

  <rect class="lane" x="60" y="122" width="1440" height="160"/>
  <text class="lane-title" x="92" y="154">入口与路由</text>

  <rect class="terminal" x="110" y="185" width="130" height="58" rx="29"/>
  <text class="text-main" x="175" y="209">START</text>
  <text class="text-sub" x="175" y="230">开始</text>

  <rect class="node" x="340" y="170" width="240" height="88"/>
  <text class="text-main" x="460" y="201">process_input</text>
  <text class="text-sub" x="460" y="227">处理输入 / 图片识别</text>

  <rect class="hitl" x="720" y="150" width="260" height="92"/>
  <text class="text-main" x="850" y="182">confirm_report_uploads</text>
  <text class="text-sub" x="850" y="208">HITL 确认报告上传</text>

  <rect class="lane" x="60" y="332" width="1440" height="280"/>
  <text class="lane-title" x="92" y="364">报告预处理与入库</text>

  <rect class="node" x="260" y="420" width="270" height="92"/>
  <text class="text-main" x="395" y="452">prepare_report_uploads</text>
  <text class="text-sub" x="395" y="478">OCR 与报告预处理</text>

  <rect class="node" x="650" y="356" width="310" height="92"/>
  <text class="text-main" x="805" y="388">notify_metadata_confirmation</text>
  <text class="text-sub" x="805" y="414">提示用户核对元数据</text>

  <rect class="hitl" x="1100" y="356" width="280" height="92"/>
  <text class="text-main" x="1240" y="388">confirm_report_metadata</text>
  <text class="text-sub" x="1240" y="414">HITL 确认报告元数据</text>

  <rect class="node" x="720" y="505" width="280" height="92"/>
  <text class="text-main" x="860" y="537">finalize_report_uploads</text>
  <text class="text-sub" x="860" y="563">报告入库 / 更新状态</text>

  <rect class="lane" x="60" y="665" width="1440" height="210"/>
  <text class="lane-title" x="92" y="697">模型调用与工具循环</text>

  <rect class="model" x="305" y="740" width="230" height="86"/>
  <text class="text-main" x="420" y="772">call_model</text>
  <text class="text-sub" x="420" y="798">调用模型</text>

  <rect class="tool" x="705" y="740" width="200" height="86"/>
  <text class="text-main" x="805" y="772">tools</text>
  <text class="text-sub" x="805" y="798">ToolNode</text>

  <rect class="model" x="1080" y="740" width="240" height="86"/>
  <text class="text-main" x="1200" y="772">generate_response</text>
  <text class="text-sub" x="1200" y="798">生成最终响应</text>

  <rect class="terminal" x="1400" y="754" width="110" height="58" rx="29"/>
  <text class="text-main" x="1455" y="778">END</text>
  <text class="text-sub" x="1455" y="799">结束</text>

  <!-- Edges: entry/routing -->
  <path class="edge" d="M240 214 C275 214, 300 214, 340 214"/>
  <path class="edge" d="M580 198 C620 194, 660 194, 720 196"/>
  <text class="label" x="625" y="184">需要确认报告分组</text>

  <path class="edge" d="M460 258 C450 315, 420 360, 395 420"/>
  <text class="label" x="320" y="335">已有待上传报告</text>

  <path class="edge" d="M430 258 C350 405, 300 610, 390 740"/>
  <text class="label" x="210" y="560">普通对话</text>

  <path class="edge" d="M850 242 C800 340, 610 380, 530 448"/>
  <text class="label" x="650" y="314">确认上传</text>

  <path class="edge" d="M980 198 C1200 250, 1280 640, 535 776"/>
  <text class="label" x="1110" y="292">不上传 / 普通对话</text>

  <!-- Edges: report flow -->
  <path class="edge" d="M530 452 C570 420, 604 406, 650 402"/>
  <text class="label" x="550" y="414">元数据需确认</text>

  <path class="edge" d="M530 486 C595 525, 640 546, 720 550"/>
  <text class="label" x="570" y="540">元数据可信</text>

  <path class="edge" d="M960 402 C1010 402, 1048 402, 1100 402"/>

  <path class="edge" d="M1240 448 C1195 520, 1085 550, 1000 551"/>
  <text class="label" x="1095" y="510">确认/编辑后入库</text>

  <path class="edge" d="M1290 448 C1380 585, 1000 706, 535 780"/>
  <text class="label" x="1230" y="614">拒绝 / 普通对话</text>

  <path class="edge" d="M720 565 C610 610, 495 670, 440 740"/>

  <!-- Edges: model/tool loop -->
  <path class="edge-loop" d="M535 783 C595 783, 645 783, 705 783"/>
  <text class="label" x="595" y="768">需要工具调用</text>

  <path class="edge-loop" d="M805 740 C770 690, 500 690, 430 740"/>
  <text class="label" x="625" y="678">工具结果回到模型</text>

  <path class="edge" d="M535 800 C710 875, 930 875, 1080 800"/>
  <text class="label" x="780" y="894">无需工具调用</text>

  <path class="edge" d="M1320 783 C1350 783, 1370 783, 1400 783"/>

  <rect x="88" y="910" width="1384" height="40" rx="12" fill="#eef7f8" stroke="#c6dde5"/>
  <text class="subtitle" x="780" y="936" text-anchor="middle">说明：粉色节点表示 HITL 暂停确认；黄色节点表示 ToolNode 工具循环；蓝色节点表示模型响应相关节点。</text>
</svg>
